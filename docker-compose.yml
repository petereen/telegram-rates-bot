services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  refresher:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "refresher.py"]
    env_file:
      - .env
    restart: unless-stopped
    init: true
